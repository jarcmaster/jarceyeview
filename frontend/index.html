<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JARC's EYE View — Vuelos en vivo</title>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.123/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.123/Build/Cesium/Cesium.js"></script>
  <style>
    html, body, #cesiumContainer { width:100%; height:100%; margin:0; overflow:hidden; background:#000;
      font-family:"Segoe UI", system-ui, sans-serif; }
    .panel { color:#dff; background:rgba(6,16,26,.82);
      border:1px solid rgba(80,180,255,.28); border-radius:12px; padding:12px 14px;
      backdrop-filter:blur(8px); box-shadow:0 6px 26px rgba(0,0,0,.5); }
    svg.ic { width:16px; height:16px; vertical-align:-3px; fill:none; stroke:currentColor;
      stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }

    /* Columnas: nada se encima */
    #left-col { position:absolute; top:12px; left:12px; bottom:44px; width:254px; z-index:10;
      display:flex; flex-direction:column; gap:10px; overflow-y:auto; padding-right:4px; }
    #right-col { position:absolute; top:52px; right:12px; width:238px; z-index:10;
      display:flex; flex-direction:column; gap:10px; max-height:calc(100vh - 64px); overflow-y:auto; }

    .panel h1, .panel h2 { display:flex; align-items:center; gap:7px; margin:0 0 8px;
      font-size:14px; letter-spacing:1px; color:#7fd3ff; font-weight:600; }
    #hud h1 { font-size:15px; letter-spacing:2px; }
    #radio h2 { color:#ffb347; }
    .row { display:flex; justify-content:space-between; font-size:13px; margin:3px 0; }
    .air{color:#5fe08a;} .ground{color:#ffcc55;} .emerg{color:#ff5c6c;}

    /* Filtros */
    #filters label { display:block; margin:8px 0 2px; color:#9cc; font-size:12px; }
    #filters input[type=text], #filters input[type=number] { width:100%; box-sizing:border-box;
      background:#0b1622; color:#dff; border:1px solid #2a4a63; border-radius:7px; padding:6px 8px; font-size:12px; }
    #filters input:focus { outline:none; border-color:#3aa0ff; }
    .chk { display:flex; align-items:center; gap:8px; margin:9px 0 0; color:#dff; font-size:12px; cursor:pointer; }
    .chk input { width:15px; height:15px; flex:0 0 auto; accent-color:#3aa0ff; margin:0; cursor:pointer; }

    /* Botones */
    button { cursor:pointer; background:#123449; color:#cfefff; border:1px solid #2a6a8f;
      border-radius:8px; padding:8px 10px; font-size:12px; margin-top:8px; width:100%;
      display:inline-flex; align-items:center; justify-content:center; gap:7px; transition:background .15s; }
    button:hover { background:#18465f; }
    button.stop { background:#5a1420; border-color:#8a2a3a; color:#ffdada; }
    button.stop:hover { background:#6f1a28; }

    .kv { display:flex; justify-content:space-between; gap:10px; font-size:12px; margin:3px 0; color:#cde; }
    .kv span:last-child { text-align:right; }
    .dot { font-size:10px; vertical-align:1px; }

    /* Umbrales rastreo */
    .th { display:inline-flex; align-items:center; justify-content:center; width:30%; gap:4px; font-size:11px;
      padding:4px 0; margin:2px 0; border-radius:6px; background:#0b1622; color:#6b8; }
    .th.done { background:#1f6b3a; color:#bff; }

    /* Listas radio / webcams */
    #radio, #webcams { display:flex; flex-direction:column; min-height:0; }
    #radio-list, #wc-list { overflow-y:auto; margin-top:6px; max-height:26vh; }
    .ritem { display:flex; justify-content:space-between; gap:8px; padding:6px 8px; border-radius:7px;
      cursor:pointer; font-size:12px; align-items:center; }
    .ritem:hover { background:#12283a; }
    .ritem.playing { background:#8a5a12; color:#fff; }
    .ritem .rmeta { color:#7a97ad; font-size:10px; white-space:nowrap; }
    .ritem.playing .rmeta { color:#ffe; }
    #np { margin-top:6px; font-size:12px; color:#ffb347; min-height:1em; display:flex; align-items:center; gap:6px; }
    #np .stopbtn { cursor:pointer; color:#ffdada; margin-left:auto; display:inline-flex; align-items:center; gap:4px; }

    /* Reproductor webcam */
    #wc-player { position:absolute; z-index:30; left:50%; transform:translateX(-50%); bottom:12px;
      width:360px; max-width:92vw; display:none; background:rgba(6,16,26,.96);
      border:1px solid #2a6a8f; border-radius:12px; overflow:hidden; box-shadow:0 8px 34px rgba(0,0,0,.6); }
    #wc-player .wc-head { display:flex; justify-content:space-between; align-items:center;
      gap:8px; padding:8px 12px; font-size:12px; color:#cfefff; }
    #wc-player iframe, #wc-player img { width:100%; height:210px; border:0; display:block; background:#000; }
    #wc-player a { color:#7fd3ff; text-decoration:none; display:inline-flex; align-items:center; gap:5px; }
    #wc-player .wc-close { cursor:pointer; color:#ffdada; display:inline-flex; }

    #sel, #trk { display:none; }
    #status { position:absolute; bottom:12px; left:12px; z-index:11; font-family:monospace;
      font-size:12px; color:#8ad; background:rgba(6,16,26,.82); padding:6px 10px; border-radius:8px;
      display:flex; align-items:center; gap:6px; }
    #err { color:#ff9aa2; }
    #overlay { position:absolute; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
      background:rgba(0,0,0,.85); color:#fdd; text-align:center; padding:24px; }
    #overlay code { color:#7fd3ff; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <div id="left-col">
    <div id="hud" class="panel">
      <h1><span data-ic="plane"></span> JARC'S EYE — VUELOS</h1>
      <div class="row"><span>A la vista</span><span id="count">0</span></div>
      <div class="row"><span class="air">En vuelo</span><span id="n-air">0</span></div>
      <div class="row"><span class="ground">En tierra</span><span id="n-ground">0</span></div>
      <div class="row"><span class="emerg">Emergencia</span><span id="n-emerg">0</span></div>
    </div>

    <div id="filters" class="panel">
      <h2><span data-ic="filter"></span> FILTROS</h2>
      <label>País contiene</label><input type="text" id="f-country" placeholder="p.ej. Mexico" />
      <label>Aerolínea / callsign empieza con</label><input type="text" id="f-airline" placeholder="p.ej. AAL, IBE" />
      <label>Altitud mínima (m)</label><input id="f-alt" type="number" placeholder="0" />
      <label class="chk"><input type="checkbox" id="f-emerg" /> Solo emergencias</label>
      <label class="chk"><input type="checkbox" id="f-trails" checked /> Mostrar estelas</label>
    </div>

    <div id="webcams" class="panel">
      <h2><span data-ic="camera"></span> WEBCAMS</h2>
      <label class="chk"><input type="checkbox" id="wc-traffic" /> <span data-ic="car"></span> Solo cámaras de tráfico</label>
      <button id="btn-scanwc"><span data-ic="search"></span> Escanear webcams aquí</button>
      <div id="wc-list"></div>
    </div>

    <div id="radio" class="panel">
      <h2><span data-ic="radio"></span> RADIO</h2>
      <button id="btn-scan"><span data-ic="search"></span> Escanear emisoras aquí</button>
      <div id="np"></div>
      <div id="radio-list"></div>
    </div>
  </div>
  <audio id="player"></audio>

  <div id="right-col">
    <div id="sel" class="panel">
      <h2><span data-ic="plane"></span> SELECCIÓN</h2>
      <div id="sel-body"></div>
      <div id="sel-status"></div>
      <button id="btn-status"><span data-ic="clipboard"></span> Horario / Gate</button>
      <button id="btn-track"><span data-ic="target"></span> Rastrear + Telegram</button>
    </div>

    <div id="trk" class="panel">
      <h2><span data-ic="target"></span> RASTREO ACTIVO</h2>
      <div id="trk-body"></div>
      <div id="trk-thr" style="margin-top:6px;"></div>
      <button id="btn-untrack" class="stop"><span data-ic="x"></span> Detener rastreo</button>
    </div>
  </div>

  <div id="wc-player"></div>

  <div id="status">conectando…</div>
  <div id="overlay"></div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const statusEl = $("status");
    const fail = (m) => { const o=$("overlay"); o.style.display="flex"; o.innerHTML=m; };

    // Iconos SVG modernos (estilo Lucide, currentColor)
    const IC = {
      plane:'<svg class="ic" viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.4-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.9.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>',
      filter:'<svg class="ic" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.5 10 19 14 21 14 12.5 22 3"/></svg>',
      camera:'<svg class="ic" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>',
      radio:'<svg class="ic" viewBox="0 0 24 24"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>',
      search:'<svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
      target:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.6"/></svg>',
      clipboard:'<svg class="ic" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>',
      x:'<svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
      stop:'<svg class="ic" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
      play:'<svg class="ic" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>',
      car:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 13l1.4-4.2A2 2 0 0 1 8.3 7h7.4a2 2 0 0 1 1.9 1.3L19 13"/><path d="M4 13h16v4a1 1 0 0 1-1 1h-1"/><path d="M6 18H5a1 1 0 0 1-1-1v-4"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg>',
      external:'<svg class="ic" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
    };
    const icon = (n) => IC[n] || "";
    document.querySelectorAll("[data-ic]").forEach(e => { e.innerHTML = icon(e.dataset.ic); });

    const PLANE_SVG =
      '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24">' +
      '<path fill="#ffffff" stroke="#0b1622" stroke-width="0.6" ' +
      'd="M12 2c.6 0 1 .8 1 1.8V9l8 4.5v1.8L13 12.6V18l2.2 1.6v1.3L12 20l-3.2.9v-1.3L11 18v-5.4L3 15.3v-1.8L11 9V3.8C11 2.8 11.4 2 12 2z"/></svg>';
    const PLANE_IMG = "data:image/svg+xml," + encodeURIComponent(PLANE_SVG);

    let cfg;
    try { cfg = await (await fetch("/config")).json(); }
    catch { fail("No pude leer <code>/config</code>. ¿Está corriendo el backend?"); throw new Error("no config"); }

    // La key de Google es opcional: sin ella se usa el globo base de Cesium (no es error).
    if (cfg.cesiumIonToken) Cesium.Ion.defaultAccessToken = cfg.cesiumIonToken;

    const viewerOpts = {
      baseLayerPicker:false, geocoder:true, homeButton:false,
      timeline:false, animation:false, sceneModePicker:false, navigationHelpButton:false,
      infoBox:false, selectionIndicator:true,
    };
    // Con Google 3D Tiles quitamos la capa base; sin ella, dejamos la imaginería
    // por defecto de Cesium ion (requiere CESIUM_ION_TOKEN) para que el globo se vea.
    if (cfg.googleApiKey) viewerOpts.baseLayer = false;
    const viewer = new Cesium.Viewer("cesiumContainer", viewerOpts);
    viewer.scene.skyAtmosphere.show = true;

    if (cfg.googleApiKey) {
      try {
        Cesium.GoogleMaps.defaultApiKey = cfg.googleApiKey;
        viewer.scene.primitives.add(await Cesium.createGooglePhotorealistic3DTileset());
      } catch (e) { fail(`No pude cargar Google 3D Tiles: <code>${e.message}</code>`); }
    }
    // Vista por defecto inmediata (por si tarda/falla la ubicación)
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(-99.13, 18.5, 300000),
      orientation: { heading:0, pitch:Cesium.Math.toRadians(-55), roll:0 },
    });

    // Volar a MI ubicación: 1) geolocalización del navegador  2) fallback por IP
    async function flyToMyLocation() {
      let loc = await new Promise((resolve) => {
        if (!navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
          p => resolve({ lat:p.coords.latitude, lon:p.coords.longitude, src:"navegador" }),
          () => resolve(null),
          { enableHighAccuracy:false, timeout:7000, maximumAge:600000 }
        );
      });
      if (!loc) {  // fallback: ubicación por IP (desde el backend)
        try {
          const j = await (await fetch("/api/geoip")).json();
          if (j && j.lat != null) loc = { lat:j.lat, lon:j.lon, src:"IP", city:j.city };
        } catch {}
      }
      if (loc) {
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(loc.lon, loc.lat, 120000),
          orientation: { heading:0, pitch:Cesium.Math.toRadians(-55), roll:0 },
          duration: 2.5,   // al terminar dispara moveEnd -> carga aviones de la zona
        });
      }
    }
    flyToMyLocation();

    const COLOR = { ok:Cesium.Color.fromCssColorString("#5fe08a"),
                    warn:Cesium.Color.fromCssColorString("#ffcc55"),
                    alert:Cesium.Color.RED };
    const TRACK_COLOR = Cesium.Color.fromCssColorString("#ff4fd8");

    // ---- Filtros -------------------------------------------------------
    const filters = { country:"", airline:"", alt:0, emerg:false, trails:true };
    function readFilters() {
      filters.country = $("f-country").value.trim().toLowerCase();
      filters.airline = $("f-airline").value.trim().toUpperCase();
      filters.alt = parseFloat($("f-alt").value) || 0;
      filters.emerg = $("f-emerg").checked;
      filters.trails = $("f-trails").checked;
      applyFilters();
    }
    ["f-country","f-airline","f-alt","f-emerg","f-trails"].forEach(id =>
      $(id).addEventListener("input", readFilters));

    function passes(d) {
      if (filters.country && !d.country.toLowerCase().includes(filters.country)) return false;
      if (filters.airline && !d.name.toUpperCase().startsWith(filters.airline)) return false;
      if (filters.alt && d.alt < filters.alt) return false;
      if (filters.emerg && d.status !== "alert") return false;
      return true;
    }
    function applyFilters() {
      for (const [, e] of entities) {
        const show = passes(e._data);
        e.entity.show = show;
        if (e.trail) e.trail.show = show && filters.trails;
      }
    }

    // ---- Dead-reckoning (#1): posición extrapolada entre polls ---------
    function extrapolate(m) {
      const dt = (performance.now() - m.t0) / 1000;
      const dist = m.speed * dt;                 // metros
      const hdg = Cesium.Math.toRadians(m.heading);
      const dlat = (dist * Math.cos(hdg)) / 111320;
      const dlon = (dist * Math.sin(hdg)) / (111320 * Math.cos(Cesium.Math.toRadians(m.lat)) || 1e-6);
      return Cesium.Cartesian3.fromDegrees(m.lon + dlon, m.lat + dlat, m.alt || 0);
    }

    // entities: icao24 -> { entity, trail, history[], meta, _data }
    const entities = new Map();
    const TRAIL_MAX = 25;

    function upsert(d) {
      let e = entities.get(d.id);
      const meta = { lat:d.lat, lon:d.lon, alt:d.alt||0, heading:d.heading, speed:d.speed, t0:performance.now() };
      if (!e) {
        const history = [];
        const entity = viewer.entities.add({
          id: d.id,   // icao24 -> permite localizar sus datos al hacer clic
          position: new Cesium.CallbackProperty(() => extrapolate(e.meta), false),
          billboard: { image:PLANE_IMG, width:28, height:28, color:COLOR[d.status]||Cesium.Color.WHITE,
            rotation:Cesium.Math.toRadians(-d.heading), alignedAxis:Cesium.Cartesian3.ZERO,
            disableDepthTestDistance:Number.POSITIVE_INFINITY },
          label: { text:d.name, font:"11px monospace", pixelOffset:new Cesium.Cartesian2(0,-22),
            fillColor:Cesium.Color.WHITE, showBackground:true,
            backgroundColor:Cesium.Color.fromCssColorString("rgba(0,0,0,.55)"),
            disableDepthTestDistance:Number.POSITIVE_INFINITY,
            distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,400000) },
        });
        const trail = viewer.entities.add({
          polyline: { positions:new Cesium.CallbackProperty(() => e.history.concat([extrapolate(e.meta)]), false),
            width:2, material:(COLOR[d.status]||Cesium.Color.WHITE).withAlpha(0.55), arcType:Cesium.ArcType.GEODESIC },
        });
        e = { entity, trail, history, meta, _data:d, cid:d.id };
        entities.set(d.id, e);
      } else {
        e.meta = meta; e._data = d;
        e.entity.billboard.color = COLOR[d.status]||Cesium.Color.WHITE;
        e.entity.billboard.rotation = Cesium.Math.toRadians(-d.heading);
        e.entity.label.text = d.name;
      }
      // punto histórico para la estela
      e.history.push(Cesium.Cartesian3.fromDegrees(d.lon, d.lat, d.alt||0));
      if (e.history.length > TRAIL_MAX) e.history.shift();
      e.entity._data = d;
    }

    function render(list) {
      const seen = new Set();
      let air=0, ground=0, emerg=0;
      for (const d of list) {
        upsert(d); seen.add(d.id);
        if (d.status==="alert") emerg++; else if (d.on_ground) ground++; else air++;
      }
      for (const [id,e] of entities) {
        if (!seen.has(id) && id !== (world.track?.icao24)) {
          viewer.entities.remove(e.entity); if (e.trail) viewer.entities.remove(e.trail);
          entities.delete(id);
        }
      }
      $("count").textContent = list.length;
      $("n-air").textContent = air; $("n-ground").textContent = ground; $("n-emerg").textContent = emerg;
      applyFilters();
      refreshSelection();   // datos del avión seleccionado, en vivo
    }

    // ---- Selección + ruta (#4) ----------------------------------------
    let selected = null;        // datos del avión seleccionado (se refresca en vivo)
    let selectedRoute = null;   // ruta cacheada del seleccionado
    viewer.selectedEntityChanged.addEventListener((ent) => {
      if (ent && typeof ent.id === "string" && ent.id.startsWith("radio:")) {
        const r = radioEntities.get(ent.id);
        if (r) playStation(r.station, ent.id);
        return;
      }
      if (ent && typeof ent.id === "string" && ent.id.startsWith("webcam:")) {
        const w = webcamEntities.get(ent.id);
        if (w) showWebcam(w.cam);
        return;
      }
      const e = ent && entities.get(ent.id);
      if (!e) { $("sel").style.display="none"; selected=null; selectedRoute=null; return; }
      selected = e._data; selectedRoute = null;
      $("sel").style.display="block";
      $("sel-status").innerHTML = "";
      renderSelection(selected, null);
      ws?.send(JSON.stringify({ type:"route", callsign:selected.name }));
    });
    const fmt = (v) => (v==null || v==="") ? "—" : v;
    function renderSelection(d, route) {
      const kmh = d.speed ? (d.speed*3.6).toFixed(0) : "0";
      const estado = d.status==="alert" ? '<span class="dot" style="color:#ff5c6c">●</span> Emergencia'
                   : d.on_ground ? '<span class="dot" style="color:#ffcc55">●</span> En tierra'
                   : '<span class="dot" style="color:#5fe08a">●</span> En vuelo';
      let ruta = `<div class="kv"><span>Ruta</span><span>buscando…</span></div>`;
      if (route) {
        const o = route.origin ? `${route.origin.icao} · ${route.origin.name}` : "¿?";
        const t = route.dest ? `${route.dest.icao} · ${route.dest.name}` : "¿?";
        const air = route.airline ? `<div class="kv"><span>Aerolínea</span><span>${route.airline}</span></div>` : "";
        ruta = air +
          `<div class="kv"><span>Origen</span><span>${o}</span></div>` +
          `<div class="kv"><span>Destino</span><span>${t}</span></div>`;
      }
      $("sel-body").innerHTML =
        `<div class="kv"><span>Callsign</span><span>${fmt(d.name)}</span></div>
         <div class="kv"><span>ICAO24</span><span>${fmt(d.id)}</span></div>
         <div class="kv"><span>País</span><span>${fmt(d.country)}</span></div>
         <div class="kv"><span>Estado</span><span>${estado}</span></div>
         <div class="kv"><span>Altitud</span><span>${Math.round(d.alt||0)} m</span></div>
         <div class="kv"><span>Velocidad</span><span>${kmh} km/h</span></div>
         <div class="kv"><span>Rumbo</span><span>${Math.round(d.heading||0)}°</span></div>
         <div class="kv"><span>Squawk</span><span>${fmt(d.squawk)}</span></div>
         <div class="kv"><span>Lat, Lon</span><span>${d.lat.toFixed(4)}, ${d.lon.toFixed(4)}</span></div>
         ${ruta}`;
    }
    // Refresca el panel con los últimos datos mientras el avión sigue seleccionado
    function refreshSelection() {
      if (!selected) return;
      const e = entities.get(selected.id);
      if (e) { selected = e._data; renderSelection(selected, selectedRoute); }
    }
    $("btn-track").addEventListener("click", () => {
      if (!selected) return;
      if (!cfg.telegram) alert("Telegram no está configurado en el backend (.env). Se rastreará igual, pero sin notificaciones.");
      ws.send(JSON.stringify({ type:"track", id:selected.id, callsign:selected.name }));
    });

    // ---- Estado de vuelo: terminal, gate, hora de aterrizaje, delay ----
    if (!cfg.flightStatus) $("btn-status").style.display = "none";
    const fmtTime = (iso) => (iso && iso.length >= 16) ? iso.slice(11, 16) : "—";
    function renderFs(fs, el) {
      if (!fs) { el.innerHTML = `<div class="rmeta" style="color:#7a97ad">Sin datos de horario para este vuelo.</div>`; return; }
      const est = { scheduled:"programado", active:"en vuelo", landed:"aterrizado",
                    cancelled:"cancelado", incident:"incidente", diverted:"desviado" }[fs.status] || fs.status || "—";
      const delay = fs.arr_delay ? `<span style="color:#ffcc55">${fs.arr_delay} min</span>` : "—";
      el.innerHTML =
        `<div class="kv"><span>Estado vuelo</span><span>${est}</span></div>
         <div class="kv"><span>Terminal</span><span>${fs.arr_terminal||"—"}</span></div>
         <div class="kv"><span>Gate</span><span>${fs.arr_gate||"—"}</span></div>
         <div class="kv"><span>Cinta equipaje</span><span>${fs.arr_baggage||"—"}</span></div>
         <div class="kv"><span>Aterrizaje prog.</span><span>${fmtTime(fs.arr_scheduled)}</span></div>
         <div class="kv"><span>Estimado</span><span>${fmtTime(fs.arr_estimated)}</span></div>
         <div class="kv"><span>Retraso llegada</span><span>${delay}</span></div>`;
    }
    $("btn-status").addEventListener("click", () => {
      if (!selected) return;
      $("sel-status").innerHTML = `<div class="rmeta" style="color:#7fd3ff">Consultando horario…</div>`;
      ws.send(JSON.stringify({ type:"status", callsign:selected.name }));
    });

    // ---- Scanner de radios (emisoras cercanas) ------------------------
    const RADIO_IMG = "data:image/svg+xml," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24">' +
      '<path fill="#ffb347" stroke="#0b1622" stroke-width="0.6" d="M12 7a2 2 0 0 0-1 3.73V21h2V10.73A2 2 0 0 0 12 7z"/>' +
      '<path fill="none" stroke="#ffb347" stroke-width="1.5" stroke-linecap="round" ' +
      'd="M8.5 5.5a6 6 0 0 0 0 8M15.5 5.5a6 6 0 0 1 0 8M10.4 7.6a3 3 0 0 0 0 3.8M13.6 7.6a3 3 0 0 1 0 3.8"/></svg>');
    const radioEntities = new Map();   // "radio:i" -> { entity, station }
    const player = $("player");
    let playingId = null;

    function viewCenter() {
      const r = viewer.camera.computeViewRectangle();
      if (r) return { lat: Cesium.Math.toDegrees((r.south + r.north) / 2),
                      lon: Cesium.Math.toDegrees((r.west + r.east) / 2) };
      const c = viewer.camera.positionCartographic;
      return { lat: Cesium.Math.toDegrees(c.latitude), lon: Cesium.Math.toDegrees(c.longitude) };
    }

    function clearRadios() {
      for (const [, r] of radioEntities) viewer.entities.remove(r.entity);
      radioEntities.clear();
    }

    async function scanRadios() {
      const { lat, lon } = viewCenter();
      $("btn-scan").innerHTML = icon("search") + " Escaneando…";
      let stations = [];
      try {
        const j = await (await fetch(`/api/radio?lat=${lat}&lon=${lon}&limit=25`)).json();
        stations = j.stations || [];
      } catch { /* red */ }
      $("btn-scan").innerHTML = icon("search") + " Escanear emisoras aquí";
      clearRadios();
      const listEl = $("radio-list");
      if (!stations.length) { listEl.innerHTML = '<div class="rmeta">Sin emisoras en esta zona.</div>'; return; }
      listEl.innerHTML = "";
      stations.forEach((st, i) => {
        const id = `radio:${i}`;
        if (st.lat != null) {
          const entity = viewer.entities.add({
            id, position: Cesium.Cartesian3.fromDegrees(st.lon, st.lat, 0),
            billboard: { image:RADIO_IMG, width:26, height:26,
              disableDepthTestDistance:Number.POSITIVE_INFINITY },
            label: { text:st.name, font:"11px sans-serif", pixelOffset:new Cesium.Cartesian2(0,-20),
              fillColor:Cesium.Color.fromCssColorString("#ffb347"), showBackground:true,
              backgroundColor:Cesium.Color.fromCssColorString("rgba(0,0,0,.55)"),
              disableDepthTestDistance:Number.POSITIVE_INFINITY,
              distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,300000) },
          });
          radioEntities.set(id, { entity, station: st });
        }
        const row = document.createElement("div");
        row.className = "ritem"; row.dataset.id = id;
        row.innerHTML = `<span>${st.name}</span>` +
          `<span class="rmeta">${st.codec||""} ${st.bitrate||0}k</span>`;
        row.onclick = () => playStation(st, id);
        listEl.appendChild(row);
      });
    }

    function playStation(st, id) {
      if (!st.url) return;
      player.src = st.url;
      player.play().then(() => {
        playingId = id;
        $("np").innerHTML = `${icon("play")} <b>${st.name}</b><span class="stopbtn">${icon("stop")} detener</span>`;
        $("np").querySelector(".stopbtn").onclick = stopStation;
        document.querySelectorAll(".ritem").forEach(el =>
          el.classList.toggle("playing", el.dataset.id === id));
      }).catch(() => {
        $("np").innerHTML = `⚠ No se pudo reproducir <b>${st.name}</b> (stream no compatible).`;
      });
    }
    function stopStation() {
      player.pause(); player.removeAttribute("src"); player.load(); playingId = null;
      $("np").textContent = "";
      document.querySelectorAll(".ritem.playing").forEach(el => el.classList.remove("playing"));
    }
    $("btn-scan").addEventListener("click", scanRadios);

    // ---- Scanner de webcams en vivo (Windy) ---------------------------
    const CAM_IMG = "data:image/svg+xml," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24">' +
      '<path fill="#7fd3ff" stroke="#0b1622" stroke-width="0.6" d="M9 4l-1.2 2H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.8L15 4z"/>' +
      '<circle cx="12" cy="12.5" r="3.4" fill="#0b1622"/><circle cx="12" cy="12.5" r="2.1" fill="#7fd3ff"/></svg>');
    const webcamEntities = new Map();   // "webcam:i" -> { entity, cam }
    if (!cfg.webcams) $("webcams").style.display = "none";

    function clearWebcams() {
      for (const [, w] of webcamEntities) viewer.entities.remove(w.entity);
      webcamEntities.clear();
    }
    async function scanWebcams() {
      const { lat, lon } = viewCenter();
      $("btn-scanwc").innerHTML = icon("search") + " Escaneando…";
      const cat = $("wc-traffic").checked ? "&category=traffic" : "";
      let cams = [];
      try {
        const j = await (await fetch(`/api/webcams?lat=${lat}&lon=${lon}&limit=25${cat}`)).json();
        cams = j.webcams || [];
      } catch {}
      $("btn-scanwc").innerHTML = icon("search") + " Escanear webcams aquí";
      clearWebcams();
      const listEl = $("wc-list");
      if (!cams.length) { listEl.innerHTML = '<div class="rmeta">Sin webcams en esta zona.</div>'; return; }
      listEl.innerHTML = "";
      cams.forEach((cam, i) => {
        const id = `webcam:${i}`;
        const entity = viewer.entities.add({
          id, position: Cesium.Cartesian3.fromDegrees(cam.lon, cam.lat, 0),
          billboard: { image:CAM_IMG, width:26, height:26,
            disableDepthTestDistance:Number.POSITIVE_INFINITY },
          label: { text:cam.title, font:"11px sans-serif", pixelOffset:new Cesium.Cartesian2(0,-20),
            fillColor:Cesium.Color.fromCssColorString("#7fd3ff"), showBackground:true,
            backgroundColor:Cesium.Color.fromCssColorString("rgba(0,0,0,.55)"),
            disableDepthTestDistance:Number.POSITIVE_INFINITY,
            distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,200000) },
        });
        webcamEntities.set(id, { entity, cam });
        const row = document.createElement("div");
        row.className = "ritem";
        row.innerHTML = `<span>${cam.title}</span><span class="rmeta">${cam.city||""}</span>`;
        row.onclick = () => showWebcam(cam);
        listEl.appendChild(row);
      });
    }
    function showWebcam(cam) {
      const p = $("wc-player");
      p.style.display = "block";
      const media = cam.embed ? `<iframe src="${cam.embed}" allowfullscreen loading="lazy"></iframe>`
                  : (cam.preview ? `<img src="${cam.preview}" alt="">` : "");
      p.innerHTML =
        `<div class="wc-head"><span>${cam.title}</span><span class="wc-close">${icon("x")}</span></div>` +
        media +
        `<div class="wc-head"><a href="${cam.detail}" target="_blank" rel="noopener">${icon("external")} Ver en Windy</a>` +
        `<span>${cam.city||""} ${cam.country||""}</span></div>`;
      p.querySelector(".wc-close").onclick = () => { p.style.display = "none"; p.innerHTML = ""; };
    }
    $("btn-scanwc").addEventListener("click", scanWebcams);

    // ---- Panel de rastreo ---------------------------------------------
    const world = { track:null };
    let destEntity=null, destLine=null;
    function renderTrack(msg) {
      if (msg.phase === "off") { $("trk").style.display="none"; world.track=null; clearDest(); return; }
      world.track = { icao24: msg.icao24 };
      $("trk").style.display="block";
      const o = msg.origin?.name || "¿?", t = msg.dest?.name || "¿?";
      const eta = msg.eta_min!=null ? `${msg.eta_min.toFixed(0)} min` : "—";
      const dist = msg.dist_km!=null ? `${msg.dist_km.toFixed(0)} km` : "—";
      $("trk-body").innerHTML =
        `<div class="kv"><span>Vuelo</span><span>${msg.callsign}</span></div>
         <div class="kv"><span>Ruta</span><span>${o} → ${t}</span></div>
         <div class="kv"><span>Distancia</span><span>${dist}</span></div>
         <div class="kv"><span>ETA</span><span>${eta}</span></div>
         <div class="kv"><span>Estado</span><span>${msg.phase==="landed"?"aterrizó":msg.phase==="lost"?"sin señal":"en vuelo"}</span></div>`
        + (msg.fs ? (() => { const f=msg.fs, ft=(i)=>(i&&i.length>=16)?i.slice(11,16):"—";
            return `<div class="kv"><span>Terminal / Gate</span><span>${f.arr_terminal||"—"} / ${f.arr_gate||"—"}</span></div>
             <div class="kv"><span>Aterrizaje prog.</span><span>${ft(f.arr_scheduled)}</span></div>
             <div class="kv"><span>Retraso</span><span>${f.arr_delay?f.arr_delay+" min":"—"}</span></div>`; })() : "");
      const fired = new Set(msg.fired||[]);
      $("trk-thr").innerHTML = ["30","20","15","10","5","landed"].map(k =>
        `<span class="th ${fired.has(k)?"done":""}">${k==="landed"?icon("plane"):k+"m"}</span>`).join("");
      // marcar destino y línea al destino
      if (msg.dest && msg.aircraft) drawDest(msg.aircraft, msg.dest);
    }
    function drawDest(a, dest) {
      const destPos = Cesium.Cartesian3.fromDegrees(dest.lon, dest.lat, 0);
      if (!destEntity) {
        destEntity = viewer.entities.add({ position:destPos,
          point:{ pixelSize:12, color:TRACK_COLOR, outlineColor:Cesium.Color.WHITE, outlineWidth:2,
            disableDepthTestDistance:Number.POSITIVE_INFINITY },
          label:{ text:dest.name, font:"12px sans-serif", fillColor:TRACK_COLOR, showBackground:true,
            pixelOffset:new Cesium.Cartesian2(0,-18), disableDepthTestDistance:Number.POSITIVE_INFINITY }});
      } else { destEntity.position = destPos; destEntity.label.text = dest.name; }
      const aPos = Cesium.Cartesian3.fromDegrees(a.lon, a.lat, a.alt||0);
      if (!destLine) {
        destLine = viewer.entities.add({ polyline:{ positions:[aPos,destPos], width:2,
          material:new Cesium.PolylineDashMaterialProperty({ color:TRACK_COLOR }), arcType:Cesium.ArcType.GEODESIC }});
      } else { destLine.polyline.positions = [aPos,destPos]; }
    }
    function clearDest(){ if(destEntity){viewer.entities.remove(destEntity);destEntity=null;}
      if(destLine){viewer.entities.remove(destLine);destLine=null;} }
    $("btn-untrack").addEventListener("click", () => ws.send(JSON.stringify({ type:"untrack" })));

    // ---- WebSocket -----------------------------------------------------
    let ws=null, bboxTimer=null;
    function sendBbox() {
      if (!ws || ws.readyState!==WebSocket.OPEN) return;
      const r = viewer.camera.computeViewRectangle(); if (!r) return;
      ws.send(JSON.stringify({ type:"bbox",
        lamin:Cesium.Math.toDegrees(r.south), lomin:Cesium.Math.toDegrees(r.west),
        lamax:Cesium.Math.toDegrees(r.north), lomax:Cesium.Math.toDegrees(r.east) }));
    }
    viewer.camera.moveEnd.addEventListener(() => { clearTimeout(bboxTimer); bboxTimer=setTimeout(sendBbox,300); });

    function liveStatus(){ statusEl.innerHTML = "● en vivo · OpenSky"+(cfg.openskyAuth?" (auth)":" (anónimo)")
        +(cfg.telegram?" · TG✓":" · TG✗"); statusEl.style.color="#5fe08a"; }
    function connect() {
      const proto = location.protocol==="https:"?"wss":"ws";
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => { liveStatus(); sendBbox(); };
      ws.onclose = () => { statusEl.textContent="○ reconectando…"; statusEl.style.color="#ffcc55"; setTimeout(connect,1500); };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type==="state") {
          render(msg.entities||[]);
          if (msg.error) { statusEl.innerHTML=`<span id="err">⚠ ${msg.error}</span>`; } else liveStatus();
        } else if (msg.type==="route") {
          if (selected && selected.name===msg.callsign) { selectedRoute = msg; renderSelection(selected, msg); }
        } else if (msg.type==="status") {
          if (selected && selected.name===msg.callsign) renderFs(msg.fs, $("sel-status"));
        } else if (msg.type==="track") {
          renderTrack(msg);
        }
      };
    }
    connect();
  </script>
</body>
</html>
